name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:cloudflare
      - run: npm run build:vinext
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ubuntu-24.04 already supplies Chromium system libraries; avoid apt mirror stalls.
      - run: npx playwright install chromium
        timeout-minutes: 3
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
